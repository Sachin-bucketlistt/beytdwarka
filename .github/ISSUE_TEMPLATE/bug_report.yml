name: Bug report
description: Something on the site or in the app is not working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Beyt Dwarka. Please include enough detail to reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear summary of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://sachin-bucketlistt.github.io/beytdwarka/
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 128 on macOS
